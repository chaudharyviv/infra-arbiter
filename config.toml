[theme]
# Mirrors the palette in apply_theme() inside infra_advisor.py.
# Streamlit's own widgets (radio dots, slider handles, checkboxes,
# markdown links, the running spinner) read these values directly and
# can't be reached by injected CSS - so this file is what keeps them
# in sync with the custom-styled buttons/metrics/expanders. Keep both
# in sync if the palette changes.
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"
